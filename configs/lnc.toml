# Intel Lion Cove (LNC) P-core -- Lunar Lake instantiation.
#
# Core and cache model only: this file sets NO memory keys, so it composes with
# whichever DRAM model you pair it with.
#
#     ./config.sh && make
#     bin/champsim --config configs/lnc.toml --config configs/dram-legacy.toml -- trace.xz
#     bin/champsim --config configs/lnc.toml --config configs/ramulator2.toml    -- trace.xz
#
# WITHOUT a DRAM config this runs ChampSim's default legacy memory
# (`data_rate = 3200`), not the LPDDR5X-8533 platform figure. The `[pmem]` block
# that used to live at the end of this file is now `configs/dram-legacy.toml`
# -- it was the one thing here that made the file legacy-only, because native
# mode refuses every `pmem.*` key.
#
# Tags: disclosed = stated by a reference below; derived = computed from one
# (capacity/associativity -> set count, load-to-use -> per-level latency);
# default = ChampSim default, not an LNC figure; pinned = neither, held at a
# value on purpose (see the comment at that line); `@rbera override` = set by hand
# against the reference, with the value it replaced kept in the comment.
# A `default` tag means the
# value equals what `bin/champsim --knobs` reports, and a disclosed figure that
# happens to coincide with a ChampSim default is still tagged disclosed.
#
# References
#   [1] https://chipsandcheese.com/p/lion-cove-intels-p-core-roars
#   [2] https://chipsandcheese.com/p/intels-lion-cove-architecture-preview
#   [3] https://handwiki.org/wiki/Engineering:Lion_Cove
#   [4] https://hardwaretimes.com/skylake-vs-sunny-cove-vs-golden-cove-vs-redwood-cove-vs-lion-cove-intel-p-core-architectures/
#   [5] https://chipsandcheese.com/p/analyzing-lion-coves-memory-subsystem
#   [6] https://www.intel.com/content/www/us/en/products/sku/240961/intel-core-ultra-9-processor-288v-12m-cache-up-to-5-10-ghz/specifications.html
#   [7] https://cdrdv2-public.intel.com/824430/2024_Intel_Tech%20Tour%20TW_Next%20Gen%20P-core%20The%20Lion%20Cove%20Architecture-4.pdf
#       (Ori Lempel, Intel Tech Tour Taiwan, June 2024 -- primary source for the front end)
#   [8] https://jbk5155.github.io/publications/MICRO_2020.pdf
#       (Kotra & Kalamatianos, AMD Research, "Improving the Utilization of
#        Micro-operation Caches in x86 Processors", MICRO 2020 -- Table I)
#   [9] https://www.7-cpu.com/cpu/Skylake.html (also Haswell.html, Ice_Lake.html)
#       -- measured mispredict penalty split by uop-cache hit/miss
#
# Notes
#  * LNC's 4-level data hierarchy is modelled as 3: the 192 KB 12-way 9-cycle
#    "L1" [3] is omitted per instruction, so cpu0_l1d IS LNC's 48 KB L0D.
#  * ChampSim latencies ADD along the path, so each level here is the disclosed
#    load-to-use minus the level above it.
#  * Lunar Lake, not Arrow Lake: its L2 (2.5 MB, 10-way) is the configuration
#    whose disclosed capacity and associativity both hold with a power-of-two
#    set count, which ChampSim requires. Arrow Lake is 3 MB / 84-cycle L3 [3].
#  * Load/store queue and register-file sizes are NOT disclosed for LNC ([4]
#    lists them as unknown); values circulating online are Golden Cove's.
#  * There is no JSON. NUM_CPUS, BLOCK_SIZE and PAGE_SIZE live in inc/defs.h;
#    memory is whichever DRAM config you pair this with; everything else is here.

[ooo_cpu.cpu0]
frequency = 4000                # @rbera override (was 5100, disclosed [6])
rob_size = 576                  # disclosed [1][3][4]
fetch_width = 8                 # derived [2] (48 B/cycle fetch)
decode_width = 8                # disclosed [1][3][4]
dispatch_width = 8              # disclosed [3][4] (rename/allocate)
execute_width = 8               # @rbera override (was 18, disclosed [1][3])
retire_width = 12               # disclosed [3][4]
lq_width = 3                    # disclosed [4] (load AGUs)
sq_width = 3                    # disclosed [4] (store AGUs)
ifetch_buffer_size = 192        # disclosed [1][3] (op queue)
lq_size = 128                   # default
sq_size = 72                    # default
register_file_size = 200        # @rbera override (was 128, ChampSim default)
decode_buffer_size = 32         # default
dispatch_buffer_size = 32       # default
scheduler_size = 128            # default
mispredict_penalty = 1          # default
decode_latency = 4              # derived [8][9] (= dib.hit_latency + 3; band 3-5)
dispatch_latency = 1            # default
schedule_latency = 0            # default
execute_latency = 0             # default
branch_predictor = "cbp6_tagescl64" # @rbera override (was "bimodal"); Stage 3 SMT: unsupported (namespace-scope globals), refused for a 2nd context
btb = "ittage_64kb"             # @rbera override (was "basic_btb", ChampSim default); Stage 3 SMT: per-context, safe for 2 contexts

# Op cache: 5250 entries, 12-way [1][3]. ChampSim's DIB is indexed by
# instruction window, not uops, so ways match and sets are the nearest
# power of two.
# The DIB models LNC's uop cache, which Lion Cove definitely has -- Intel's own
# front-end slide lists "Uop cache capacity growth and read BW increase" [7].
# (The "Intel dropped the uop cache" reports are about Skymont, the Lunar Lake
# E-core, not Lion Cove.)
#
# UNIT NOTE for inorder_width: [1] gives the uop cache 12 micro-ops/cycle against
# 8 instructions/cycle of decode. ChampSim never cracks an instruction into
# micro-ops -- one trace instruction is one op everywhere in the model -- so the
# two figures are carried across 1:1 and the DIB path ends up wider than decode,
# which is the real machine's ordering. It is the RATIO that is modelled here,
# not a micro-op count.
#
# hit_latency vs decode_latency: Intel states the ordering for this exact core --
# "The DSB pipeline has shorter latency and delivered higher bandwidth than the
# MITE (legacy instruction decode pipeline)", in the Lion Cove perfmon TMA metric
# text -- but publishes no magnitude for either path, on Lion Cove or Golden
# Cove, and the Lion Cove deck [7] gives a data-side load-to-use table while
# omitting the front end entirely. The 3-cycle gap below is therefore DERIVED
# from two independent sources that agree, neither of them Intel:
#   * AMD Research's uop-cache paper [8] publishes its simulator configuration as
#     "Decoder Latency: 3 cycles" and gives the uop cache no latency of its own,
#     so its entire modelled uop-cache advantage is exactly 3 cycles. That model
#     is stated as correlated with silicon and RTL at R^2 = 0.98.
#   * 7-cpu's measured branch-misprediction penalties [9], split by uop-cache
#     hit/miss, give 3.0-4.0 cycles on Haswell, Skylake and Ice Lake. A
#     mispredict restarts the front end, so that delta IS the path-depth gap.
# Ceiling: AMD Zen 4 bounds the op-cache component below 7 cycles. Floor: Agner
# Fog could not resolve the difference above measurement noise on Skylake or Ice
# Lake at all, which argues for the low end of the 3-5 band rather than the high.
#
# TREAT decode_latency AS A SENSITIVITY PARAMETER, NOT A CALIBRATED CONSTANT.
# Every source that pins a number describes a front end at least two generations
# older, and Golden Cove and Lion Cove are precisely where Intel invested in the
# legacy path -- four decoders to six to eight, fetch 16 to 32 B/cycle. Agner on
# the Alder Lake P-core: "The decoders in the P cores are now so efficient that
# the uop cache is less important." The true LNC gap may be 1-2 cycles, and no
# fetchable source can currently tell those cases apart.
#
# ---------------------------------------------------------------------------
#
# SIZING -- why 128 sets and not 512.
#
# One DIB entry is one 16-byte ALIGNED WINDOW of instruction bytes, not one
# micro-op: dib_shift masks lg2(window_size) = 4 bits off the IP for both the
# set index and the tag. Sizing this structure as though an entry were a
# micro-op therefore overstates its capacity by however many instructions share
# a window.
#
# ---------------------------------------------------------------------------
[ooo_cpu.cpu0.dib]
sets = 128                      # derived [1] (5250 uops / 3.8 instr-per-window / 12 ways)
ways = 12                       # disclosed [3]
window_size = 16                # default
hit_latency = 1                 # pinned -- see the note above
inorder_width = 12              # derived [1] (12 uops/cycle; see the unit note above)
hit_buffer_size = 32            # default -- no LNC figure published

# The direct target predictor inside the selected BTB. It owns branch PRESENCE
# and TYPE as well as direct targets: a miss here means no prediction at all,
# whatever the indirect predictor or the RAS would have said. 1024x8 is the
# geometry the BTB write-ups pin, and is what every recorded comparison used --
# the values below are those defaults stated explicitly, not a change.
#
# NOTE this table is tied to `btb = "ittage_64kb"` above. Module knobs are only
# consulted when their module is selected, and an unconsulted key is fatal, so
# changing the BTB means changing this table name too (or deleting it).
[ooo_cpu.cpu0.ittage_64kb]
direct.sets = 1024              # default (pinned by the BTB write-ups)
direct.ways = 8                 # default (pinned by the BTB write-ups)

# L0I: 64 KB, 16-way, 4 cycles [3]
[cache.cpu0_l1i]
sets = 64                       # derived [3]
ways = 16                       # disclosed [3]
latency = 4                     # disclosed [1]
mshr_size = 8                   # default
rq_size = 64                    # default
wq_size = 64                    # default
pq_size = 32                    # default
prefetcher = "no"               # default
replacement = "lru"             # default

# L0D: 48 KB, 12-way, 4 cycles [1][3]
[cache.cpu0_l1d]
sets = 64                       # derived [3]
ways = 12                       # disclosed [3]
latency = 4                     # disclosed [1][3]
mshr_size = 16                  # default
rq_size = 64                    # default
wq_size = 64                    # default
pq_size = 8                     # default
prefetcher = "no"               # default
replacement = "lru"             # default

# L2: 2.5 MB, 10-way, 17-cycle load-to-use [3]
[cache.cpu0_l2c]
sets = 4096                     # derived [3]
ways = 10                       # disclosed [3]
latency = 13                    # derived [3] (17 - 4)
mshr_size = 32                  # @rbera override (was 80, disclosed [1])
rq_size = 32                    # default
wq_size = 32                    # default
pq_size = 16                    # default
prefetcher = "no"               # default
replacement = "lru"             # default

# L3 slice: 3 MB, 12-way, 51-cycle load-to-use [1][3]
[cache.llc]
sets = 4096                     # derived [1][3]
ways = 12                       # disclosed [3]
latency = 34                    # derived [3] (51 - 17)
mshr_size = 64                  # default
rq_size = 32                    # default
wq_size = 32                    # default
pq_size = 32                    # default
prefetcher = "no"               # default
replacement = "ship"            # @rbera override (was "lru", ChampSim default)

# DTLB: 128 entries [1][3]
[cache.cpu0_dtlb]
sets = 32                       # derived [1]
ways = 4                        # default
latency = 1                     # default

[cache.cpu0_itlb]
sets = 16                       # default
ways = 4                        # default
latency = 1                     # default

# STLB: 4096 entries, +7 cycles over the L1 TLBs [1]
[cache.cpu0_stlb]
sets = 256                      # derived [1]
ways = 16                       # derived [1]  (256 x 16 = the 4096 entries)
latency = 7                     # disclosed [1]
